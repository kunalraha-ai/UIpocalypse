<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture Home</title>
  </head>
  <body>
    <h1>Fixture Home</h1>
    <button id="dead">Dead button</button>
    <button id="alive" onclick="window.n = (window.n || 0) + 1; document.title = 'clicked ' + window.n">Alive button</button>
    <button id="boom" onclick="notAFunction()">Boom button</button>
    <button id="alerts" onclick="alert('hi')">Alert button</button>
    <button id="flagonce" onclick="if (!window.flag) { window.flag = 1; document.title = 'flagged'; }">Flag once</button>
    <a href="page2.html">Page 2</a>
    <input id="name" placeholder="your name" />
    <form onsubmit="event.preventDefault(); document.title = 'subscribed'">
      <input type="email" name="email" placeholder="you@example.com" />
      <button type="submit">Subscribe</button>
    </form>
    <!-- a real POST write the Double-Clicker can double-fire (duplicate_request
         guard). fetch-based like real app submits — a native form POST would
         navigate away on the first click and race the second one away. -->
    <button onclick="fetch('/api/echo', { method: 'POST' }); document.title = 'echoed'">Echo submit</button>
    <!-- GraphQL: one click fires TWO DIFFERENT mutations at one endpoint.
         URL-keyed duplicate detection would read this as a double-submit
         (count=2 on /api/graphql) — a false duplicate. Operation-keyed
         detection sees IncA:1, IncB:1 — no duplicate. -->
    <button onclick="fetch('/api/graphql', { method: 'POST', body: JSON.stringify({ operationName: 'IncA', query: 'mutation IncA { incA }' }) }); fetch('/api/graphql', { method: 'POST', body: JSON.stringify({ operationName: 'IncB', query: 'mutation IncB { incB }' }) })">Fire two ops</button>
    <!-- GraphQL submit-like control the Double-Clicker double-fires: a TRUE
         duplicate, now keyed and reported by operation name, not just URL. -->
    <button onclick="fetch('/api/graphql', { method: 'POST', body: JSON.stringify({ operationName: 'EchoMut', query: 'mutation EchoMut { echo }' }) }); document.title = 'gql echoed'">GraphQL submit</button>
  </body>
</html>
