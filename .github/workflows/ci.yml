name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  uipocalypse:
    name: uipocalypse (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uipocalypse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  sample-app:
    name: sample-app (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  spikes:
    name: spikes (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
